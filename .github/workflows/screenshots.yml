name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon recordRoborazziDebug 2>&1 | tee build.log; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|^ *> [^T]|Exception|FAILED|at com\.leolu" build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Screenshot run failed::$msg"
            exit 1
          fi

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots"
            # main may have moved while rendering; screenshots never conflict with code.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
